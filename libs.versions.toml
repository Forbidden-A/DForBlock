[versions]
kotlin = "2.3.21"
kotlinx-coroutines = "1.10.2"
shadow = "9.4.1"
kotlin-logging = "7.0.3"
json5 = "0.5.0"
adventure = "4.26.1"
luckperms = "5.4"
kord = "fix-required-field-compv2-SNAPSHOT"
paper-api = "26.1.2.build.+"
run-task = "3.0.2"

[libraries]
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
json5 = { module = "li.songe:json5", version.ref = "json5" }
kord-core = { module = "dev.kord:kord-core", version.ref = "kord" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
luckperms = { module = "net.luckperms:api", version.ref = "luckperms" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }